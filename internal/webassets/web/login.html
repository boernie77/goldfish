<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Anmelden – Goldfish</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0c2a3a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Goldfish" />
<link rel="stylesheet" href="/style.css" />
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; }
.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 24px 20px;
  min-width: 280px;
  max-width: 360px;
  width: 100%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.login-card h1 {
  margin: 0 0 14px;
  font-size: 20px;
  text-align: center;
}
.login-card .brand {
  text-align: center;
  margin-bottom: 12px;
}
.login-card .brand img {
  width: 128px;
  height: 128px;
}
.login-card label { display: block; margin-bottom: 10px; font-size: 13px; }
.login-card label input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin-top: 4px;
  padding: 8px 10px;
  font-size: 15px;
}
.login-card button { width: 100%; padding: 9px; font-size: 15px; margin-top: 10px; }
.login-card .err {
  color: #ef4444;
  font-size: 13px;
  margin: 6px 0;
  min-height: 16px;
  text-align: center;
}
.login-card .hint { margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<main class="login-card">
  <div class="brand"><img src="/favicon.svg" alt="Goldfish" /></div>
  <h1 id="loginTitle">Anmelden</h1>
  <form id="loginForm">
    <label>Benutzername <input type="text" name="username" autocomplete="username" required autofocus /></label>
    <label>Passwort <input type="password" name="password" autocomplete="current-password" required /></label>
    <!-- Setup-Mode: zusätzliche Konfig-Felder, eingeblendet wenn keine User existieren.
         Einklappbar, damit normale Login-Form nicht überladen wirkt. -->
    <div id="setupExtra" style="display:none">
      <details style="margin-top:8px">
        <summary style="cursor:pointer; color:var(--orange,#ff8c00); user-select:none">
          Optional: API-Keys jetzt eintragen (kann später auch in Settings)
        </summary>
        <label style="margin-top:8px;display:block">TMDB API-Key
          <input type="text" name="tmdbKey" placeholder="(optional, aber stark empfohlen)" autocomplete="off" />
          <span style="font-size:11px; color:#888">Kostenlos auf themoviedb.org/settings/api · ohne Key keine Poster/Plot/Cast</span>
        </label>
        <label style="margin-top:8px;display:block">OMDb API-Key
          <input type="text" name="omdbKey" placeholder="(optional, IMDb-Fallback)" autocomplete="off" />
          <span style="font-size:11px; color:#888">omdbapi.com — nur als Fallback wenn TMDB einen Eintrag nicht findet</span>
        </label>
      </details>
    </div>
    <div class="err" id="loginErr"></div>
    <button type="submit" class="primary">Anmelden</button>
  </form>
  <div id="ssoBlock" style="display:none; margin-top:14px;">
    <div style="display:flex; align-items:center; gap:8px; margin:10px 0; color:#777; font-size:12px;">
      <div style="flex:1; height:1px; background:var(--border);"></div>
      <span>oder</span>
      <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>
    <button type="button" id="ssoBtn" style="width:100%; padding:9px; font-size:15px;">Mit Authentik anmelden</button>
  </div>
  <p class="hint" id="setupHint" style="display:none">
    Noch kein Benutzer vorhanden. Der erste Benutzer wird Administrator.
  </p>
  <p class="hint" style="margin-top:16px; text-align:center;">
    <a href="/datenschutz.html">Datenschutz</a>
  </p>
</main>
<script>
async function check() {
  try {
    const r = await fetch("/api/auth/status");
    const d = await r.json();
    if (d.setup) {
      document.getElementById("loginTitle").textContent = "Erste Einrichtung";
      document.getElementById("loginForm").querySelector("button").textContent = "Admin-Konto anlegen";
      document.getElementById("setupHint").style.display = "block";
      document.getElementById("setupExtra").style.display = "block";
      document.getElementById("loginForm").dataset.mode = "setup";
    } else {
      // SSO-Block nur sichtbar wenn schon User existieren (Setup nicht mehr nötig)
      document.getElementById("ssoBlock").style.display = "block";
    }
    if (d.loggedIn) location.href = "/";
  } catch {}
}
check();

// SSO error from backend redirect (?sso_error=...)
(function () {
  const u = new URL(window.location.href);
  const err = u.searchParams.get("sso_error");
  if (err) {
    document.getElementById("loginErr").textContent = err;
    u.searchParams.delete("sso_error");
    window.history.replaceState(null, "", u.pathname + (u.search || ""));
  }
})();

document.getElementById("ssoBtn").addEventListener("click", () => {
  window.location.href = "/api/auth/oidc/login";
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const err = document.getElementById("loginErr");
  err.textContent = "";
  const body = Object.fromEntries(new FormData(form));
  const url = form.dataset.mode === "setup" ? "/api/auth/setup" : "/api/auth/login";
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({error:"Fehler"}));
      err.textContent = j.error || "Fehler";
      return;
    }
    location.href = "/";
  } catch (e) {
    err.textContent = e.message;
  }
});
</script>
</body>
</html>
